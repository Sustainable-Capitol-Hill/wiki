name: Sync and Deploy Wiki

on:
  # Run every 10 minutes
  schedule:
    - cron: "*/10 * * * *"

  # Allow manual trigger
  workflow_dispatch:

  # Auto-deploy on code changes
  push:
    branches: [astro]

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent multiple deployments running at once
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Restore Drive sync cache
        uses: actions/cache@v4
        with:
          path: |
            src/content/docs/
            public/images/
            sync-state.json
            folder-metadata.json
          key: drive-sync-${{ github.run_number }}
          restore-keys: |
            drive-sync-

      - name: Sync from Google Drive
        id: sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: pnpm sync

      - name: Build Astro site
        if: steps.sync.outputs.has_changes == 'true'
        env:
          PUBLIC_GOOGLE_ANALYTICS_ID: ${{ secrets.PUBLIC_GOOGLE_ANALYTICS_ID }}
        run: pnpm build

      - name: Setup Pages
        if: steps.sync.outputs.has_changes == 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.sync.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        if: steps.sync.outputs.has_changes == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
